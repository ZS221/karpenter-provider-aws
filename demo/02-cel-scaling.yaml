# BEAT 2 -- CEL expressions resolved PER INSTANCE TYPE.
#
# One EC2NodeClass. One expression. Two NodePools pinned to different instance
# sizes. The same manifest yields different kubelet configuration on each node,
# because the expression is evaluated against that instance type's attributes.
#
#   maxPods: "vcpus * 8"
#     m5.large  (2 vCPU) -> 16 allocatable pods
#     m5.xlarge (4 vCPU) -> 32 allocatable pods
#
#   kubeReserved.cpu: "max(60, vcpus * 30)"   -- millicores, floored at 60m
#     m5.large  -> 60m   (max(60, 60))
#     m5.xlarge -> 120m  (max(60, 120))
#
#   kubeReserved.memory: "memory_mib / 100"   -- ~1% of node memory, in MiB
#     m5.large  (memory_mib 8192)  -> 96Mi
#     m5.xlarge (memory_mib 16384) -> 176Mi
#
#   systemReserved.cpu: "max(20, vcpus * 10)" -- the same floor idiom, smaller share
#     m5.large  -> 20m   (max(20, 20))
#     m5.xlarge -> 40m   (max(20, 40))
#
#   systemReserved.memory: "memory_mib / 200" -- ~0.5% of node memory
#     m5.large  -> 48Mi
#     m5.xlarge -> 96Mi
#
# All six values above were resolved by the branch's own CEL code rather than worked
# out by hand, and the kubeReserved pair matches capture/full-run.txt.
#
# Rounding, because two numbers here look wrong until you know it: cpu rounds UP to the
# next 10m and memory UP to the next 16Mi (cpuRoundingMilliCores / memoryRoundingMiB in
# pkg/cel/environment.go). So 8192/100 = 81.92 truncates to 81 and then rounds up to
# 96Mi -- not down to 80Mi. The same effect breaks the tidy 2:1 ratio you would expect
# between the /100 and /200 memory expressions on m5.xlarge: 163 -> 176Mi while
# 81 -> 96Mi. Independent rounding, not a bug, but do not invite the audience to halve
# 176 in their heads.
#
# Available variables: vcpus, memory_mib, default_enis, ips_per_eni, max_pods,
# instance_type. Available functions: min(), max().
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: demo-2-cel
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-karpenter-cel-demo
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: karpenter-cel-demo
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: karpenter-cel-demo
  kubelet:
    maxPods: "vcpus * 8"
    kubeReserved:
      cpu: "max(60, vcpus * 30)"
      memory: "memory_mib / 100"
    systemReserved:
      cpu: "max(20, vcpus * 10)"
      memory: "memory_mib / 200"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: demo-2-small
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.large"]     # 2 vCPU, 8 GiB
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: demo-2-cel
      expireAfter: 720h
  limits:
    cpu: 20
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: demo-2-large
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.xlarge"]    # 4 vCPU, 16 GiB
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: demo-2-cel
      expireAfter: 720h
  limits:
    cpu: 20
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
